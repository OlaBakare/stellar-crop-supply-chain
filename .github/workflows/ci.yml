name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Build contracts
        run: |
          cd contracts
          cargo build --target wasm32v1-none --release
      - name: Run contract tests
        run: |
          cd contracts
          # Raise the per-test-thread stack size: the Soroban host uses deep
          # recursion that can overflow the 2 MiB default thread stack when
          # many tests run in parallel.
          RUST_MIN_STACK=16777216 cargo test
      - name: Run clippy
        run: |
          cd contracts
          cargo clippy -- -D warnings
      - name: Check formatting
        run: |
          cd contracts
          cargo fmt --all -- --check

  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: cd sdk && npm ci
      - run: cd sdk && npm run build
      - run: cd sdk && npm run lint
      - run: cd sdk && npm run test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            frontend/package-lock.json
      - name: Build SDK (frontend depends on ../sdk)
        run: |
          cd sdk
          npm ci
          npm run build
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
