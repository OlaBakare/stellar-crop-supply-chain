name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd sdk && npm ci && npm run build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            contracts/target/wasm32v1-none/release/crop_supply_chain.wasm
          generate_release_notes: true
